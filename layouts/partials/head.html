{{- $mode := .Params.mode | default "meadow" -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">

<!-- Inline mode initialization (prevents flash) -->
<script>
(function(){
  var e=document.documentElement;
  try{
    var t=localStorage.getItem('site-mode');
    var urlMode=new URLSearchParams(window.location.search).get('mode');
    var mode=t || urlMode || 'meadow';
    if(mode==='meadow'||mode==='dacian') e.setAttribute('data-mode',mode);
  }catch(n){}
})();
</script>

<!-- CSS: base + both mode styles (visibility controlled by data-mode) -->
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/meadow.css">
<link rel="stylesheet" href="/css/dacian.css">
<meta name="theme-color" content="{{ if eq $mode "meadow" }}#c1b0e7{{ else }}#104088{{ end }}">

<!-- Font preloads -->
<link rel="preload" href="/assets/aleis-dot.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://fonts.gstatic.com/s/googlesans/v28/4UaGrENHsxJlGDuGo1OIlL3Owp5eKQ.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="https://fonts.gstatic.com/s/googlesanscode/v12/k3kZo8kEwt-Tshb7wcTFsEwmt4pqjC8JtVAt1cDo4VeI3DCu.woff2" as="font" type="font/woff2" crossorigin>

<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:image" content="{{ "assets/og.png" | absURL }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}: writing" href="/feed.xml">
<link rel="canonical" href="{{ .Permalink }}">
