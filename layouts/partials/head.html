{{- $zone := .Params.zone | default "meadow" -}}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
{{- if eq $zone "cards" }}
<style>html{color-scheme:light;background:#f2f6ff}</style>
{{- else }}
<script>(function(){var e=document.documentElement;e.className+=' js';try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')e.setAttribute('data-theme',t);}catch(n){}})();</script>
<style>html{color-scheme:dark;background:#1f1a24}@media(prefers-color-scheme:light){html:not([data-theme=dark]){color-scheme:light;background:#f7e8ee}}html[data-theme=light]{color-scheme:light;background:#f7e8ee}</style>
{{- end }}
<meta name="theme-color" content="{{ if eq $zone "cards" }}#f2f6ff{{ else }}#c1b0e7{{ end }}">
<meta property="og:title" content="{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:image" content="{{ "assets/og.png" | absURL }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/favicon-180.png">
<link rel="alternate" type="application/rss+xml" title="{{ site.Title }}: writing" href="/feed.xml">
<link rel="canonical" href="{{ .Permalink }}">
{{- if ne $zone "cards" }}
<link rel="preload" href="/assets/aleis-dot.woff2" as="font" type="font/woff2" crossorigin>
{{- end }}
<link rel="stylesheet" href="/css/style.css">
