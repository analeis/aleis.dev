{{- $mode := .Params.mode | default "meadow" -}}
<footer class="foot">
  <a href="{{ site.Params.github }}" target="_blank" rel="noopener">github</a>
  <a href="mailto:{{ site.Params.email }}">email</a>
  <a href="/feed.xml">rss</a>
  <button
    type="button"
    class="theme"
    data-mode-toggle
    data-meadow="switch to Meadow"
    data-dacian="switch to Dacian"
    hidden
    aria-label="Switch theme"
  ></button>
</footer>
