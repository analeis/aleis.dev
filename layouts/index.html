{{ define "main" }} {{- $posts := where site.RegularPages.ByDate.Reverse
"Section" "writing" }}
<div class="home">
  <h1>{{ site.Params.greeting }}</h1>
  {{- with $posts }}{{ with index . 0 }}
  <div class="latest">
    <span class="muted">latest</span>
    <a class="accent" href="{{ .RelPermalink }}">{{ .Title }}</a>
    <span class="muted">{{ .Date.Format "Jan 2" }}</span>
  </div>
  {{- end }}{{ end }}

</div>
{{ end }}
