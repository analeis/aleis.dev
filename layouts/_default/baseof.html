{{- $zone := .Params.zone | default "meadow" -}}
<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="zone-{{ $zone }}" data-page="{{ if .IsHome }}home{{ else }}page{{ end }}">
  <div class="root">
    <canvas class="meadow" aria-hidden="true"></canvas>

    <div class="wrap">
      {{ partial "header.html" . }}

      <div class="fade">
        <main>
          {{ block "main" . }}{{ end }}
        </main>
        <div class="floor" aria-hidden="true"></div>
      </div>

      {{ partial "footer.html" . }}
    </div>

    <canvas class="fall" aria-hidden="true"></canvas>
  </div>

  {{- if ne $zone "cards" }}
  <script src="/js/meadow.js" defer></script>
  {{- end }}
  <script src="/js/site.js" defer></script>
</body>
</html>
