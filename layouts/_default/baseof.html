{{- $mode := .Params.mode | default "meadow" -}}
<!doctype html>
<html lang="{{ site.Language.Locale }}" data-mode="{{ $mode }}">
  <head>
    {{ partial "head.html" . }}
  </head>
  <body
    class="mode-{{ $mode }}"
    data-page="{{ if .IsHome }}home{{ else }}page{{ end }}"
  >
    <div class="root">
      <canvas class="meadow" aria-hidden="true"></canvas>

      <div class="wrap">
        {{ partial "header.html" . }}

        <div class="fade">
          <main>{{ block "main" . }}{{ end }}</main>
          <div class="floor" aria-hidden="true"></div>
        </div>

        {{ partial "footer.html" . }}
      </div>

      <canvas class="fall" aria-hidden="true"></canvas>
    </div>

    <!-- Single bundled script (mode-specific code guarded internally) -->
    <script src="/js/index.js" defer></script>
  </body>
</html>
