name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Build
        run: hugo --minify --gc --panicOnWarning
