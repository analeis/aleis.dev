name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hugo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.168.0"
          extended: true

      - name: Type-check (bun)
        run: bun check

      - name: Format check (bun)
        run: bun fmt --check .

      - name: Build
        run: bun run build
